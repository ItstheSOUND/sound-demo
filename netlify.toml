[build]
  publish = "."
  command = ""

# A static site: the player is index.html (no email gate) with its clips in
# clips/ and the hero in img/, both written by Scripts/tools/demo_assets.py.
# Keep old /prototype.html links working:
[[redirects]]
  from = "/prototype.html"
  to = "/"
  status = 301

# The artist calculator, generated by Scripts/build_plays_calculator.py. The
# short address fits on a business card; the long one is the canonical page,
# and the page's own canonical link and og:url name it. This is a rewrite
# (status 200), not a redirect: as a 301, LinkedIn's fetcher reported
# "500 Failure" on /plays in Post Inspector on 2026-09-10 while the .html
# address previewed fine, and a rewrite leaves no redirect for any fetcher
# to mishandle.
[[redirects]]
  from = "/plays"
  to = "/what-your-plays-would-have-paid.html"
  status = 200

# The pages keep Netlify's default for static files, read 2026-09-16 at
# docs.netlify.com/build/caching/caching-overview/ ("Cache-Control: public,
# max-age=0, must-revalidate"): a normal refresh revalidates, the ETag makes
# that a cheap 304 when nothing changed, and a new deploy shows up at once.
# The clips and the hero are named by their content hash, so a changed file is
# a new name and the old name never has to be refetched: a year in the browser
# cache, no revalidation.
[[headers]]
  for = "/clips/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
