[build]
  publish = "."
  command = ""

# Static, self-contained prototype. The player is index.html (no email gate).
# Keep old /prototype.html links working:
[[redirects]]
  from = "/prototype.html"
  to = "/"
  status = 301

# The artist calculator, generated by Scripts/build_plays_calculator.py. The
# short address fits on a business card; the long one is the canonical page,
# and the page's own canonical link and og:url name it. This is a rewrite
# (status 200), not a redirect: as a 301, LinkedIn's fetcher reported
# "500 Failure" on /plays in Post Inspector on 2026-09-10 while the .html
# address previewed fine, and a rewrite leaves no redirect for any fetcher
# to mishandle.
[[redirects]]
  from = "/plays"
  to = "/what-your-plays-would-have-paid.html"
  status = 200

# Always revalidate the app HTML so a new deploy shows up on a normal refresh
# (no hard-refresh or incognito needed). Netlify's ETag makes that a cheap 304
# when nothing changed, and a full fetch only when the file actually changed.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
